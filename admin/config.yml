backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "settings"
    label: "Cài Đặt Giao Diện"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "Cài đặt chung"
        file: "content/settings.yml"
        fields:
          - {label: "Slogan Chính", name: "hero_title", widget: "string", required: false}
          - {label: "Đoạn Giới Thiệu Ngắn", name: "hero_subtitle", widget: "text", required: false}
          - {label: "Ảnh Nền Hero", name: "hero_bg", widget: "image", required: false}
          - {label: "Màu Chủ Đạo (VD: #38bdf8)", name: "accent_color", widget: "string", required: false}
          - {label: "Màu Nền Trang (VD: #0f172a)", name: "bg_color", widget: "string", required: false}
          - {label: "--- ĐỔI TÊN CÁC ĐẦU MỤC ---", name: "divider", widget: "hidden", required: false}
          - {label: "Tên mục Dự Án", name: "title_projects", widget: "string", default: "Dự Án Của Tôi", required: false}
          - {label: "Tên mục Nghiên Cứu", name: "title_research", widget: "string", default: "Đề Tài Nghiên Cứu", required: false}
          - {label: "Tên mục Đồ Án", name: "title_assignments", widget: "string", default: "Hồ Sơ Đồ Án", required: false}
          - {label: "Tên mục Ý Tưởng", name: "title_ideas", widget: "string", default: "Góc Ý Tưởng", required: false}
          - {label: "Tên mục Liên Kết", name: "title_links", widget: "string", default: "Xuất Bản & Liên Kết Ngoài", required: false}

  - name: "projects"
    label: "Mục 1: Dự Án"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Dự Án", name: "title", widget: "string"}
      - {label: "Ảnh Đại Diện", name: "image", widget: "image"}
      - {label: "Mô Tả Ngắn", name: "description", widget: "text"}

  - name: "research"
    label: "Mục 2: Nghiên Cứu"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Bài Nghiên Cứu", name: "title", widget: "string"}
      - {label: "Loại Đề Tài", name: "category", widget: "select", options: ["Nghiên cứu của tôi", "Đề tài sưu tầm hay"]}
      - {label: "Ảnh Bìa", name: "thumbnail", widget: "image"}
      - {label: "Tóm Tắt (Abstract)", name: "summary", widget: "text"}
      - {label: "File Tài Liệu (PDF)", name: "file", widget: "file"}

  - name: "assignments"
    label: "Mục 3: Đồ Án"
    folder: "content/assignments"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Đồ Án", name: "title", widget: "string"}
      - {label: "Phân Loại Đồ Án", name: "category", widget: "select", options: ["Đồ án tổng hợp", "Đồ án tốt nghiệp"]}
      - {label: "Ảnh Đại Diện Đồ Án", name: "image", widget: "image"}
      - {label: "Mô Tả / Nội Dung Đồ Án", name: "description", widget: "text"}
      - {label: "File Đồ Án (PDF)", name: "file", widget: "file", required: false}

  - name: "ideas"
    label: "Mục 4: Ý Tưởng"
    folder: "content/ideas"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Ý Tưởng", name: "title", widget: "string"}
      - {label: "Ảnh Minh Họa", name: "image", widget: "image", required: false}
      - {label: "Nội Dung Chi Tiết", name: "description", widget: "text"}

  - name: "links
