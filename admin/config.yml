backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "settings"
    label: "Cài Đặt Giao Diện"
    delete: false # Không cho phép xóa file cấu hình này
    editor:
      preview: false
    files:
      - name: "general"
        label: "Cài đặt chung"
        file: "content/settings.yml"
        fields:
          - {label: "Slogan Chính", name: "hero_title", widget: "string"}
          - {label: "Đoạn Giới Thiệu Ngắn", name: "hero_subtitle", widget: "text"}
          - {label: "Ảnh Nền Hero (Chạy dưới chữ)", name: "hero_bg", widget: "image"}
          - {label: "Màu Chủ Đạo (Dạng mã # ví dụ #38bdf8)", name: "accent_color", widget: "string"}
          - {label: "Màu Nền Trang Web (Dạng mã # ví dụ #0f172a)", name: "bg_color", widget: "string"}

  - name: "projects"
    label: "Dự Án Của Tôi"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Dự Án", name: "title", widget: "string"}
      - {label: "Ảnh Đại Diện", name: "image", widget: "image"}
      - {label: "Mô Tả Ngắn", name: "description", widget: "text"}

  - name: "research"
    label: "Đề Tài Nghiên Cứu"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Bài Nghiên Cứu", name: "title", widget: "string"}
      - {label: "Loại Đề Tài", name: "category", widget: "select", options: ["Nghiên cứu của tôi", "Đề tài sưu tầm hay"]}
      - {label: "Ảnh Bìa", name: "thumbnail", widget: "image"}
      - {label: "Tóm Tắt (Abstract)", name: "summary", widget: "text"}
      - {label: "File Tài Liệu (PDF)", name: "file", widget: "file"}

  - name: "links"
    label: "Liên Kết Ngoài (ArchDaily v.v.)"
    folder: "content/links"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Tên Trang Web", name: "title", widget: "string"}
      - {label: "Đường Dẫn URL", name: "url", widget: "string"}
